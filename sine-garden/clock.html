<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Clock</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; justify-content: center; align-items: flex-start;
    background: radial-gradient(ellipse at 50% 20%, #1c2a3a, #0b1218 70%);
    color: rgba(255, 245, 230, 0.85);
    font: 13px/1.4 system-ui, sans-serif; letter-spacing: 0.03em;
  }
  main { width: min(420px, 100% - 32px); padding: 32px 0 40px; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; opacity: 0.8; }
  .sub { margin: 0 0 20px; text-align: center; font-size: 12px; opacity: 0.55; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px 0 0; font-size: 12px; }
  .controls input { width: 160px; accent-color: #f1cdb0; }
  .controls output { min-width: 3.4em; font-variant-numeric: tabular-nums; }
  a { color: #f1cdb0; }
  /* Larger type for the dial's text on its own page */
  .master-clock { font-size: 13px; }
  .master-clock .now { margin-top: 16px; text-align: center; }
  .master-clock h2 { margin-top: 18px; }
  .master-clock li { padding: 3px 0; border-bottom: 1px solid rgba(255, 245, 230, 0.08); }
</style>
</head>
<body>
<main>
  <h1>Master Clock</h1>
  <p class="sub">Seasons, weather and goings on in the <a href="index.html" target="_blank">Sine Garden</a></p>
  <div id="dial"></div>
  <div class="controls">
    <label for="speed">time</label>
    <input id="speed" type="range" min="0" max="20" step="0.5" value="1">
    <output id="speedLabel">1×</output>
  </div>
</main>
<script src="master-clock.js"></script>
<script>
// A standalone view of the master clock. Opened alongside the garden (from
// the same place), the two pages share one clock: changing the speed here
// changes it in the garden too, and the other way round.
const size = Math.min(360, document.querySelector("main").clientWidth);
MasterClock.mountDial(document.getElementById("dial"), { size, inline: true });

const speedInput = document.getElementById("speed");
const speedLabel = document.getElementById("speedLabel");
const showSpeed = (speed) => {
  speedInput.value = speed;
  speedLabel.textContent = speed === 0 ? "paused" : `${speed}×`;
};
speedInput.addEventListener("input", () => {
  MasterClock.speed = Number(speedInput.value);
  showSpeed(MasterClock.speed);
});
MasterClock.onChange(({ speed }) => showSpeed(speed));
</script>
</body>
</html>
